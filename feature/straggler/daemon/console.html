<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATHelper 慢节点检测控制台</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #e2e4e8;
    --text: #1f2328; --muted: #6b7280; --primary: #2563eb;
    --green: #16a34a; --amber: #d97706; --red: #dc2626;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.running { background: var(--green); }
  .badge.paused { background: var(--amber); }
  .refresh { margin-left: auto; color: var(--muted); font-size: 12px; }
  .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .card h2 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .card .body { padding: 12px 14px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; row-gap: 6px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s; }
  button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  button.danger { color: var(--red); }
  button.danger:hover:not(:disabled) { border-color: var(--red); }
  input { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 90px; }
  .interval-form { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .th-grid { display: grid; grid-template-columns: 128px 110px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
  .th-grid label { color: var(--muted); }
  .th-grid input { width: 100%; }
  .th-grid .unit { color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #eef2ff; }
  tbody tr.selected { background: #dbeafe; }
  .err { color: var(--red); font-weight: 600; }
  .sum { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 7px; border-radius: 4px; background: #eef2ff; color: #3730a3; font-size: 11px; }
  .sum.bad { background: #fee2e2; color: #991b1b; }
  .tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--border); }
  .tabs button { border: none; border-radius: 0; background: none; padding: 9px 14px; border-bottom: 2px solid transparent; font-size: 13px; color: var(--muted); }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab-body { padding: 14px; }
  pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow: auto; background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
  #detail .ts { color: #94a3b8; }
  #detail .phead { color: #e2e8f0; }
  .ptag { margin-left: 8px; font-size: 11px; font-weight: 400; color: var(--muted); }
  .ptag.on { color: var(--green); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all .2s; z-index: 100; }
  .toast.show { opacity: 1; transform: none; }
  .toast.ok { background: var(--green); }
  .toast.fail { background: var(--red); }
</style>
</head>
<body>
<header>
  <h1>慢节点检测控制台</h1>
  <span id="stateBadge" class="badge">—</span>
  <span class="refresh">每 5s 自动刷新</span>
</header>

<div class="wrap">
  <div class="col">
    <div class="card">
      <h2>运行状态</h2>
      <div class="body">
        <dl class="kv">
          <dt>检测周期</dt><dd id="vInterval">—</dd>
          <dt>阈值</dt><dd id="vThresholds">—</dd>
          <dt>已运行周期</dt><dd id="vTotal">—</dd>
          <dt>失败周期</dt><dd id="vFailed">—</dd>
          <dt>下次运行</dt><dd id="vNext">—</dd>
          <dt>Profiler 目录</dt><dd id="vProfilerDir">—</dd>
          <dt>KPI 目录</dt><dd id="vKpiDir">—</dd>
        </dl>
      </div>
    </div>

    <div class="card">
      <h2>控制</h2>
      <div class="body">
        <div class="controls">
          <button class="primary" id="btnStart">启动</button>
          <button id="btnPause">暂停</button>
          <button id="btnTrigger">立即触发</button>
          <button class="danger" id="btnStop">关闭守护进程</button>
        </div>
        <div class="interval-form" style="margin-top:12px;">
          周期(秒):
          <input id="intervalInput" type="number" min="60">
          <button id="btnInterval">设置</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>阈值设置</h2>
      <div class="body">
        <div class="th-grid">
          <label for="thCal">慢计算 cal</label>
          <input id="thCal" type="number" step="0.05" min="0">
          <span class="unit">kmeans 比例，默认 1.3</span>
          <label for="thCpu">慢CPU cpu</label>
          <input id="thCpu" type="number" step="0.05" min="0">
          <span class="unit">kmeans 比例，默认 2.5</span>
          <label for="thBubble">NPU Bubble</label>
          <input id="thBubble" type="number" min="0">
          <span class="unit">纳秒 ns，默认 5000</span>
          <label for="thCommThreshold">慢通信 comm</label>
          <input id="thCommThreshold" type="number" step="0.05" min="1">
          <span class="unit">带宽比，默认 1.3</span>
          <label for="thCommMinCount">通信 min-count</label>
          <input id="thCommMinCount" type="number" min="0">
          <span class="unit">采集门槛，默认 1000</span>
          <label for="thCommCountFloor">通信 count-floor</label>
          <input id="thCommCountFloor" type="number" min="0">
          <span class="unit">参与检测下限，默认 10240</span>
        </div>
        <div class="controls" style="margin-top:12px;">
          <button class="primary" id="btnThresholds">保存阈值</button>
          <button id="btnThresholdsDefault">恢复默认值</button>
        </div>
        <div class="muted" style="margin-top:8px;font-size:11px;">阈值只影响后续检测，不改写历史结果。</div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2>周期历史 <span id="histCount" style="color:var(--muted);font-weight:400;"></span></h2>
      <div style="overflow:auto; max-height:36vh;">
        <table>
          <thead><tr><th>#</th><th>开始时间</th><th>耗时</th><th>DB</th><th>异常摘要</th><th>KPI</th><th>状态</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
      <div id="histEmpty" class="empty">加载中…</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabProgress" class="active">检测进度</button>
        <button id="tabReport">检测报告</button>
        <button id="tabResult">检测结果（JSON格式）</button>
        <button id="tabOpMetric">算法输入数据</button>
      </div>
      <div class="tab-body">
        <pre id="detail">请选择左侧历史周期查看详情。</pre>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
let selectedId = null;
let selectedRunning = false;
let latestThresholds = {};
let latestDefaults = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function fmtNs(us) { return us + 'us'; }

function toast(msg, ok) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'fail');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2500);
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text().catch(()=>'')));
  return r.json();
}

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const txt = await r.text().catch(()=> '');
  let data = {};
  try { data = txt ? JSON.parse(txt) : {}; } catch(e) {}
  if (!r.ok) throw new Error(r.status + (txt ? ' ' + txt : ''));
  return data;
}

function timeFmt(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function msFmt(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function renderStatus(s) {
  $('stateBadge').textContent = (s.state || '—').toUpperCase();
  $('stateBadge').className = 'badge ' + (s.state === 'running' ? 'running' : 'paused');
  $('vInterval').textContent = s.interval_sec != null ? s.interval_sec + ' s' : '—';
  const th = s.thresholds || {};
  $('vThresholds').textContent = th.cal != null
    ? `cal=${th.cal} cpu=${th.cpu} bubble=${th.bubble_ns}ns comm=${th.comm_threshold}`
    : '—';
  latestThresholds = th;
  latestDefaults = s.default_thresholds || {};
  fillThresholdInputs(th);
  $('vTotal').textContent = s.cycles_total != null ? s.cycles_total : '—';
  $('vFailed').textContent = s.cycles_failed != null ? s.cycles_failed : '—';
  $('vNext').textContent = timeFmt(s.next_run_at);
  $('vProfilerDir').textContent = s.profiler_dir || '—';
  $('vKpiDir').textContent = s.kpi_dir || '（未启用）';
  if (!$('intervalInput').value) $('intervalInput').value = s.interval_sec || 600;
  $('btnStart').disabled = s.state === 'running';
  $('btnPause').disabled = s.state !== 'running';
}

function renderSummary(el, summary) {
  if (!summary || !Object.keys(summary).length) return '—';
  const order = ['cal','comm','cpu','npu_bubble'];
  const parts = [];
  for (const k of order) {
    if (summary[k] != null && summary[k] > 0) parts.push(`<span class="sum bad">${k}:${summary[k]}</span>`);
  }
  for (const [k,v] of Object.entries(summary)) {
    if (order.includes(k)) continue;
    if (v > 0) parts.push(`<span class="sum">${k}:${v}</span>`);
  }
  return parts.length ? parts.join('') : '正常';
}

function renderHistory(cycles) {
  $('histBody').innerHTML = '';
  $('histEmpty').style.display = cycles.length ? 'none' : 'block';
  $('histEmpty').textContent = cycles.length ? '' : '暂无周期记录';
  $('histCount').textContent = cycles.length ? `（${cycles.length}）` : '';
  for (const c of cycles) {
    const tr = document.createElement('tr');
    tr.onclick = () => select(c.id, c.running, tr);
    if (c.id === selectedId) tr.className = 'selected';
    const cells = [
      c.id,
      timeFmt(c.started_at),
      c.running ? '进行中…' : msFmt(c.duration_ms),
      c.dbs != null ? c.dbs : '—',
      c.running ? '<span class="ptag on">运行中</span>' : (c.error ? `<span class="err">失败</span>` : renderSummary(null, c.summary)),
      c.kpi_status || '—',
    ];
    cells.forEach((h, i) => {
      const td = document.createElement('td');
      if (i === 4) td.innerHTML = h; else td.textContent = h;
      tr.appendChild(td);
    });
    $('histBody').appendChild(tr);
  }
}

function select(id, running, tr) {
  selectedId = id;
  selectedRunning = !!running;
  document.querySelectorAll('#histBody tr').forEach(x => x.classList.remove('selected'));
  if (tr) tr.classList.add('selected');
  loadCurrent();
}

function activeTab() {
  if ($('tabReport').classList.contains('active')) return 'report';
  if ($('tabResult').classList.contains('active')) return 'result';
  if ($('tabOpMetric').classList.contains('active')) return 'opMetric';
  return 'progress';
}

// Load the content for the active tab at the selected cycle id.
function loadCurrent() {
  const tab = activeTab();
  if (tab === 'progress') { loadProgressDetail(selectedId); return; }
  if (selectedRunning) {
    $('detail').textContent = '（本轮进行中，暂无检测报告 / 检测结果 / 算法输入数据）';
    return;
  }
  loadDetail(selectedId, tab);
}

async function loadProgressDetail(id) {
  try {
    renderProgress(await getJSON('/straggler/progress/' + (id != null ? id : 'latest')));
  } catch(e) { $('detail').textContent = '加载失败：' + e.message; }
}

function renderProgress(p) {
  const pre = $('detail');
  const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  const lines = p.lines || [];
  if (!lines.length) { pre.textContent = '暂无进度记录'; return; }
  const head = p.in_flight ? '<span class="phead">进行中</span>\n' : '';
  pre.innerHTML = head + lines.map(l => `<span class="ts">[${esc(l.ts)}]</span> ${esc(l.text)}`).join('\n');
  if (stick) pre.scrollTop = pre.scrollHeight;
}

async function loadDetail(id, tab) {
  try {
    if (tab === 'report') {
      const r = await fetch('/straggler/report/' + id);
      if (!r.ok) throw new Error('报告不可用：' + r.status);
      $('detail').textContent = await r.text();
    } else if (tab === 'result') {
      const r = await fetch('/straggler/results/' + id);
      if (!r.ok) throw new Error('结果不可用：' + r.status);
      $('detail').textContent = JSON.stringify(await r.json(), null, 2);
    } else if (tab === 'opMetric') {
      const r = await fetch('/straggler/op_metric/' + id);
      if (!r.ok) throw new Error('算法输入数据不可用：' + r.status);
      $('detail').textContent = JSON.stringify(await r.json(), null, 2);
    }
  } catch (e) {
    $('detail').textContent = '加载失败：' + e.message;
  }
}

async function refresh() {
  try {
    const [s, h] = await Promise.all([getJSON('/status'), getJSON('/straggler/results/history')]);
    renderStatus(s);
    renderHistory(h.cycles || []);
  } catch (e) {
    $('stateBadge').textContent = 'ERROR';
    $('stateBadge').className = 'badge paused';
    toast('刷新失败：' + e.message, false);
  }
}

async function control(kind) {
  try {
    if (kind === 'stop') {
      if (!confirm('确定关闭守护进程？关闭后将删除所有落盘结果。')) return;
    }
    await post('/daemon/' + kind);
    toast('已发送：' + kind, true);
    setTimeout(refresh, 500);
  } catch (e) {
    toast('操作失败：' + e.message, false);
  }
}

$('btnStart').onclick = () => control('start');
$('btnPause').onclick = () => control('pause');
$('btnTrigger').onclick = () => control('trigger');
$('btnStop').onclick = () => control('stop');
$('btnInterval').onclick = async () => {
  const v = parseInt($('intervalInput').value, 10);
  if (!v || v < 60 || v > 86400) { toast('周期需在 [60, 86400] 秒之间', false); return; }
  try {
    await post('/daemon/interval', { interval_sec: v });
    toast('周期已更新为 ' + v + 's', true);
    refresh();
  } catch (e) { toast('设置失败：' + e.message, false); }
};
function fillThresholdInputs(th, force) {
  const set = (id, val) => { if (val != null && (force || !$(id).value)) $(id).value = val; };
  set('thCal', th.cal); set('thCpu', th.cpu); set('thBubble', th.bubble_ns);
  set('thCommThreshold', th.comm_threshold); set('thCommMinCount', th.comm_min_count); set('thCommCountFloor', th.comm_count_floor);
}
async function saveThresholds(body, okMsg) {
  try {
    await post('/daemon/thresholds', body);
    toast(okMsg, true);
    refresh();
  } catch (e) { toast('设置失败：' + e.message, false); }
}
$('btnThresholds').onclick = () => {
  const num = id => parseFloat($(id).value);
  const body = {
    cal: num('thCal'), cpu: num('thCpu'), bubble_ns: num('thBubble'),
    comm_threshold: num('thCommThreshold'), comm_min_count: parseInt($('thCommMinCount').value, 10),
    comm_count_floor: parseInt($('thCommCountFloor').value, 10),
  };
  if (!(body.cal > 0) || !(body.cpu > 0) || !(body.bubble_ns > 0) || !(body.comm_threshold > 1) ||
      !(body.comm_min_count > 0) || !(body.comm_count_floor > 0)) {
    toast('阈值非法：cal/cpu/bubble/min-count/floor 须 >0，comm 须 >1', false);
    return;
  }
  saveThresholds(body, '阈值已更新');
};
$('btnThresholdsDefault').onclick = () => {
  const d = latestDefaults;
  if (d.cal == null) { toast('默认值尚未加载，请稍后重试', false); return; }
  fillThresholdInputs(d, true);
  saveThresholds({
    cal: d.cal, cpu: d.cpu, bubble_ns: d.bubble_ns,
    comm_threshold: d.comm_threshold, comm_min_count: d.comm_min_count, comm_count_floor: d.comm_count_floor,
  }, '已恢复默认值');
};

['tabProgress','tabReport','tabResult','tabOpMetric'].forEach(id => {
  $(id).onclick = () => {
    ['tabProgress','tabReport','tabResult','tabOpMetric'].forEach(t => $(t).classList.remove('active'));
    $(id).classList.add('active');
    loadCurrent();
  };
});

refresh();
setInterval(refresh, 5000);
loadCurrent();
// Keep the progress view live (1s) while it is the active tab.
setInterval(() => { if (activeTab() === 'progress') loadProgressDetail(selectedId); }, 1000);
</script>
</body>
</html>
